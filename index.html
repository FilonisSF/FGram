<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FGram App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="card">
    <h2 id="greeting">Загрузка...</h2>
    <p>Ваш ID: <b id="user-id">-</b></p>
</div>

<button id="send-btn">Отправить данные боту</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
        document.getElementById('greeting').innerText = `Привет, ${user.first_name}!`;
        document.getElementById('user-id').innerText = user.id;
    }

    document.getElementById('send-btn').addEventListener('click', () => {
        tg.HapticFeedback.impactOccurred('medium');
        tg.sendData(JSON.stringify({ message: "Кнопка нажата из WebApp!" }));
    });
</script>
</body>
</html>
