<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FGram Client Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --danger: #f43f5e;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }
    .header-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    h2 { margin: 0 0 4px 0; font-size: 20px; }
    p { margin: 0; color: var(--subtext); font-size: 13px; }
    
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--subtext);
      margin: 16px 4px 8px 4px;
    }

    .module-item {
      background: var(--card-bg);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .module-info b { display: block; font-size: 15px; margin-bottom: 2px; }
    .module-info span { font-size: 12px; color: var(--subtext); }

    /* Тумблер (Switch) */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .btn-primary { background-color: var(--accent); color: #0f172a; }
    .btn-danger { background-color: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
    .btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="header-card">
    <div class="badge">FGRAM CORE v1.0</div>
    <h2 id="user-name">Панель управления</h2>
    <p>ID: <span id="user-id">---</span></p>
  </div>

  <div class="section-title">Активные модули контроля</div>

  <div class="module-item">
    <div class="module-info">
      <b>Anti-Edit Spy</b>
      <span>Фиксация изменений сообщений</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="spy-toggle" checked onchange="vibrate()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="module-item">
    <div class="module-info">
      <b>Auto-Delete Mute</b>
      <span>Моментальное стирание спама</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="mute-toggle" checked onchange="vibrate()">
      <span class="slider"></span>
    </label>
  </div>

  <div class="section-title">Быстрые действия</div>
  <button class="btn btn-primary" onclick="sendAction('get_stats')">📊 Запросить статистику кэша</button>
  <button class="btn btn-danger" onclick="sendAction('clear_mutes')">🗑 Сбросить всех заглушенных юзеров</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Заполнение профиля
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-name').innerText = user.first_name || "Оператор";
      document.getElementById('user-id').innerText = user.id;
    }

    function vibrate() {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.selectionChanged();
      }
    }

    function sendAction(actionName) {
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }
      // Отправляем команду боту и закрываем окно
      tg.sendData(JSON.stringify({ action: actionName }));
    }
  </script>
</body>
</html>
